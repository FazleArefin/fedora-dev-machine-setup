---

- name: Add vscode rpm key
  ansible.builtin.rpm_key:
    key: "{{ vscode_rpm_key_url }}"

- name: Add vscode repo
  ansible.builtin.yum_repository:
    name: code
    description: Visual Studio Code
    baseurl: "{{ vscode_yum_repository_url }}"
    enabled: true
    gpgkey: "{{ vscode_rpm_key_url }}"
    gpgcheck: true
    file: vscode

- name: Install latest visual studio code
  ansible.builtin.dnf:
    name: "{{ vscode_package_name }}"

# TODO (workaround, not a permanent fix):
# On Fedora 45 the system crypto library moved to OpenSSL 4, while VS Code's
# bundled extension-signing helper (vsce-sign) only looks for libssl.so.3.
# As a result every extension install fails with
# "Signature verification failed with 'UnknownError'". Installing the OpenSSL 3
# compat library (openssl3-libs, pulled in by this provides) restores
# verification while keeping the system on OpenSSL 4.
# See: https://computingforgeeks.com/install-visual-studio-code-on-fedora/
- name: Workaround - install OpenSSL 3 compat library for VS Code extension verification (Fedora 45)
  ansible.builtin.dnf:
    name: "libssl.so.3()(64bit)"
    state: present

- name: Install some popular VSCode extensions
  ansible.builtin.command: >-
    code --install-extension {{ item }}
  loop: "{{ vscode_extensions }}"
  loop_control:
    pause: 0.5  # to avoid rate limiting
  become: true
  become_user: "{{ local_username }}"
  register: vscode_install_result
  changed_when: "'successfully installed' in vscode_install_result.stdout"
  failed_when: >
    vscode_install_result.rc != 0
    and 'already installed' not in vscode_install_result.stdout.lower()

...
