---

- name: Install zsh and other related packages
  ansible.builtin.dnf:
    name: "{{ zsh_packages }}"
    state: present

- name: Change user's shell to zsh
  ansible.builtin.user:
    name: "{{ local_username }}"
    shell: /bin/zsh

- name: Setup zinit and zsh configuration files
  become: true
  become_user: "{{ local_username }}"
  block:
    - name: Ensure zinit installation directory exists
      ansible.builtin.file:
        path: "{{ zsh_zinit.install_path | expanduser }}"
        state: directory
        mode: '0755'

    - name: Clone zinit git repo
      ansible.builtin.git:
        repo: "{{ zsh_zinit.repo }}"
        dest: "{{ zsh_zinit.install_path | expanduser }}"
        version: "{{ zsh_zinit.version }}"
        update: true

    - name: Copy the sample .zshrc file (timestamped backup if content changes)
      ansible.builtin.copy:
        src: .zshrc
        dest: "/home/{{ local_username }}/.zshrc"
        mode: '0644'
        force: true
        backup: true

    - name: Copy the sample .shell_*.sh files (timestamped backup if content changes)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/home/{{ local_username }}/{{ item }}"
        mode: '0644'
        backup: true
      loop:
        - .shell_aliases.sh
        - .shell_functions.sh
        - .shell_variables.sh

...
