---

- name: Post-installation cleanup and instructions
  hosts: localhost
  tasks:
    - name: Remove redundant packages
      ansible.builtin.dnf:
        autoremove: true

    - name: Display post install message
      ansible.builtin.pause:
        seconds: 10
        prompt: |

          Manual steps left to do:
            - (optional) add noatime option for your SSD mount points in /etc/fstab
            - (optional) configure additional multimedia codecs from https://rpmfusion.org/Howto/Multimedia
            - Reboot your system

          Press Enter to finish
