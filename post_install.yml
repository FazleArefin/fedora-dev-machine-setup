---

- name: Post-installation cleanup and instructions
  hosts: localhost
  tasks:
    - name: Remove redundant packages
      ansible.builtin.dnf:
        autoremove: true

    - name: Display post install message
      ansible.builtin.debug:
        msg:
          - 'Manual steps left to do:'
          - >-
            - add noatime option for your SSD mounts points
            in /etc/fstab (optional)
          - '- Reboot your system'
