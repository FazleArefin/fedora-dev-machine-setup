---

vscode_rpm_key_url: "https://packages.microsoft.com/keys/microsoft.asc"
vscode_yum_repository_url: "https://packages.microsoft.com/yumrepos/vscode"
vscode_package_name: code

vscode_extensions:
  - EdwinHuiSH.better-comments-next  # better comments extension
  - formulahendry.code-runner  # code runner extension
  - eamodio.gitlens  # supercharged git capabilities
  - oderwat.indent-rainbow  # indent rainbow extension
  - ms-python.python  # python extension
  - ms-python.vscode-pylance  # python language server
  - humao.rest-client  # REST client for testing APIs
  - FanaticPythoner.better-todo-tree  # todo comments highlighter
  - shardulm94.trailing-spaces  # highlight trailing spaces
  - vscodevim.vim  # vim emulation
  - esbenp.prettier-vscode  # code formatter
  - redhat.vscode-yaml  # YAML support and validation
  - davidanson.vscode-markdownlint  # markdown linting and style checking
  - OpenTofu.vscode-opentofu  # OpenTofu extension
  - gera2ld.markmap-vscode  # create mindmap from markdown file
  - redhat.ansible  # ansible extension
  - timonwong.shellcheck  # shellcheck linter for sh/bash/dash/ksh scripts
  - Catppuccin.catppuccin-vsc  # Catppuccin theme
  - Catppuccin.catppuccin-vsc-icons  # Catppuccin icons
  - rust-lang.rust-analyzer  # rust analyzer extension
  - vadimcn.vscode-lldb  # native debugger powered by LLDB. Debug C++, Rust and other compiled languages
  - usernamehw.errorlens  # Improve highlighting of errors, warnings and other language diagnostics
  - tamasfe.even-better-toml  # TOML support

...
